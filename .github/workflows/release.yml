name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update system.json version
        run: |
          jq --arg v "${{ steps.get_version.outputs.VERSION }}" \
             --arg dl "https://github.com/Celtic-Trinity-Studios/CTS-DND-35/releases/download/${{ github.ref_name }}/CTS-DND-35.zip" \
             '.version = $v | .download = $dl' system.json > system.json.tmp
          mv system.json.tmp system.json

      - name: Create zip
        run: |
          cd ..
          zip -r CTS-DND-35/CTS-DND-35.zip CTS-DND-35 \
            -x "CTS-DND-35/.git/*" \
            -x "CTS-DND-35/.github/*" \
            -x "CTS-DND-35/node_modules/*" \
            -x "CTS-DND-35/.gitignore"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CTS-DND-35.zip
            system.json
          generate_release_notes: true
